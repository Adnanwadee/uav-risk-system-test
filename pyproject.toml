[project]
name = "uav-risk-system"
version = "0.1.0"
requires-python = ">=3.10,<3.12"

dependencies = [
    "numpy==1.24.4",
    "pandas==2.0.3",
    "scikit-learn==1.2.2",
    "xgboost==1.7.6",
    "joblib",
    "pydantic>=2",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "requests",
    "rank-bm25",
    "streamlit",
    "matplotlib==3.7.3"
]
[tool.ruff.per-file-ignores]
"src/uav_risk/stage1/loader.py" = ["E402"]
"ui/app.py" = ["E402"]
