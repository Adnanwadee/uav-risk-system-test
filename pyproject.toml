[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-risk-system"
version = "0.2.0" # إصدار الجيل الجديد (Neuro-Symbolic)
requires-python = ">=3.10,<3.13"

dependencies = [
    # --- 1. Legacy ML & Core Data (STRICT VERSIONING - DO NOT CHANGE) ---
    "numpy==1.24.4",         # لحماية نماذج المرحلة الأولى
    "scipy==1.11.4",         # نسخة جاهزة تتوافق مع numpy القديم وتمنع البناء من الصفر
    "pandas==2.0.3",
    "scikit-learn==1.2.2",
    "xgboost==1.7.6",
    "joblib",
    
    # --- 2. API & Infrastructure ---
    "pydantic>=2.0",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",                 # بديل requests المظلم (يدعم Async)
    "streamlit",
    "matplotlib==3.7.3",
    
    # --- 3. The Agentic Brain (LangGraph Core) ---
    "langgraph>=0.0.26",     # محرك الوكلاء
    "langchain-core",        # البنية الأساسية
    "langchain-groq",        # للتواصل مع Groq LPU
    "instructor",            # لإجبار الـ LLM على إخراج JSON صارم
    
    # --- 4. Advanced Hybrid RAG (FAISS Integration) ---
    "faiss-cpu==1.8.0",           # محرك البحث المتجهي
    "sentence-transformers",      # نماذج التضمين وإعادة الترتيب (Re-ranking)
    "langchain-huggingface",      # لربط نماذج HuggingFace
    "langchain-community",        # لربط محرك FAISS ببيئة LangChain
    
    # --- 5. Observability ---
    "langsmith"              # الصندوق الأسود لتسجيل قرارات الوكيل
]

[tool.ruff.per-file-ignores]
"src/uav_risk/stage1/loader.py" = ["E402"]
"ui/app.py" = ["E402"]