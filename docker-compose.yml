services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-skies-backend:latest
    container_name: smart-skies-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  frontend:
    image: nginx:alpine
    container_name: smart-skies-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend