name: CI/CD Pipeline - UAV Risk System

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      # 1) Pull repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3) Install project dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .

      # 4) Functional test (verifies logic/output)
      - name: Functional test (run system)
        run: |
          python run.py

      # 5) Non-functional test (code quality / static analysis)
      - name: Non-functional test (code quality - flake8)
        run: |
          pip install flake8
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      # 6) Build Docker image (deployment step)
      - name: Build Docker image
        run: |
          docker build -t uav-risk-system .

      # 7) Pipeline finished
      - name: CI/CD finished
        run: echo "CI/CD pipeline completed successfully"
