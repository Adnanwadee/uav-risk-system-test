[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-risk-system"
version = "2.0.0"  # Master Execution Blueprint v4.0
description = "Production-grade UAV Risk Assessment System with Agentic AI"
requires-python = ">=3.10,<3.13"  # Python 3.10-3.12 for compatibility

# ⚠️ ML CORE DEPENDENCIES (LOCKED - DO NOT CHANGE)
# These versions match the training environment exactly
dependencies = [
    # --- Stage 1: ML Model (Frozen for reproducibility) ---
    "numpy==2.0.2",
    "pandas==2.2.2",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "lightgbm==4.6.0",
    "shap==0.49.1",
    "joblib==1.5.3",
    "imbalanced-learn==0.14.0",
    "category-encoders==2.8.1",
    "numba==0.60.0",
    
    # --- Stage 2: Production API & Infrastructure ---
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    
    # --- Agentic Orchestration ---
    "langgraph>=0.0.40",
    "langchain-core>=0.1.0",
    "langchain-groq>=0.1.0",
    "instructor>=0.5.0",
    "tenacity>=8.2.0",
    
    # --- RAG & Vector Search ---
    "sentence-transformers>=2.3.0",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "langchain-huggingface>=0.0.1",
    
    # --- LLM Client ---
    "groq>=0.4.0",
    
    # --- Observability & Logging ---
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "langsmith>=0.0.77",
    
    # --- Security & Utilities ---
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.8.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
ui = [
    "streamlit>=1.25.0",
    "plotly>=5.17.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["uav_risk*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["artifacts/*", "knowledge/*", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]  # Allow long lines for data, allow function calls in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers --cov=src/uav_risk --cov-report=term-missing"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false  # Relax for rapid prototyping