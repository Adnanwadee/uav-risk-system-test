[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-risk-system"
version = "0.3.0"  # الإصدار الجديد بعد إعادة الهيكلة
requires-python = ">=3.10,<3.13"

dependencies = [

    # --- 1. Stage1 ML (نفس بيئة التدريب - إصدارات ثابتة) ---
    "numpy==2.0.2",
    "pandas==2.2.2",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "lightgbm==4.6.0",
    "shap==0.49.1",
    "joblib==1.5.3",
    "imbalanced-learn==0.14.0",
    "category-encoders==2.8.1",
    "numba==0.60.0",      # ✅ إضافة numba - السبب الحقيقي للخطأ


    # --- 2. Testing & Quality ---
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    
    # --- 3. API & Infrastructure ---
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",         # Async HTTP client
    "streamlit>=1.25.0",
    "matplotlib>=3.5.0",
    "plotly>=5.17.0",        # مخططات تفاعلية
    "seaborn>=0.11.0",       # تصورات إحصائية
    
    # --- 4. Agent & LLM ---
    "langgraph>=0.0.26",     # Agent orchestration
    "langchain-core>=0.1.0",
    "langchain-groq>=0.1.0", # Groq API (مجاني وسريع)
    "instructor>=0.5.0",     # JSON output enforcement
    "tenacity>=8.2.0",       # Retry logic
    
    # --- 5. RAG & Vector Search ---
    "faiss-cpu>=1.8.0",      # Vector database
    "sentence-transformers>=2.2.0",  # Embeddings + reranker
    "langchain-huggingface>=0.0.1",
    "langchain-community>=0.0.10",
    
    # --- 6. Observability & Monitoring ---
    "langsmith>=0.0.77",     # Tracing and analytics
    
    # --- 7. Utilities ---
    "python-dotenv>=1.0.0",  # Environment variables
    "typing-extensions>=4.8.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]

[tool.ruff.per-file-ignores]
"src/uav_risk/stage1/loader.py" = ["E402"]
"ui/app.py" = ["E402"]
"src/uav_risk/ml/loader.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true