[project]
name = "uav-risk-system"
version = "0.1.0"
requires-python = ">=3.10,<3.12"

dependencies = [
    "numpy==1.24.4",
    "pandas",
    "scikit-learn==1.2.2",
    "xgboost==1.7.6",
    "joblib",
    "pydantic>=2",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "requests",
    "rank-bm25"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
