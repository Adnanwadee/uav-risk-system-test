name: CI/CD Pipeline - UAV Risk System

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout code
        uses: actions/checkout@v4

      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .
          

      
      - name: Functional test (run system)
        run: |
          python run.py

     
      - name: Non-functional test (code quality - flake8)
        run: |
          pip install flake8
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      
      - name: Build Docker image
        run: |
          docker build -t uav-risk-system .

      
      - name: CI/CD finished
        run: echo "CI/CD pipeline completed successfully"
