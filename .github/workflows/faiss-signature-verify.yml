name: FAISS Signature Verify

on:
  push:
    paths:
      - 'src/uav_risk/stage2/rag/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'src/uav_risk/stage2/rag/**'
      - 'tests/**'

jobs:
  verify-signature-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies (best-effort)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest
      - name: Run FAISS signing tests
        run: |
          PYTHONPATH=. pytest -q -k "faiss"
