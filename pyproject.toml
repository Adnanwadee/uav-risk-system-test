[project]
name = "uav-risk-system"
version = "0.1.0"
requires-python = ">=3.10,<3.12"

dependencies = [
    "numpy==1.24.4",
    "pandas>=1.5,<2.1",
    "scikit-learn==1.2.2",
    "xgboost>=1.7,<2.0",
    "joblib>=1.1",
    "pydantic>=2",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "python-multipart"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
